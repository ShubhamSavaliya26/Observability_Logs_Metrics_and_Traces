spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:orderdb
spring.h2.console.enabled=true

product.service.url=${PRODUCT_SERVICE_URL:http://product-service:8080/api/products}

logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [corr:%X{correlationId}] [trace:%X{traceId}] [span:%X{spanId}] %logger{36} - %msg%n


management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

info.app.name=order-service
info.app.description=Order microservice for Assignment 4
