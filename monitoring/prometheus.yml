global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "product-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["product-service.ecommerce.svc.cluster.local:8080"]

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order-service.ecommerce.svc.cluster.local:8082"]
